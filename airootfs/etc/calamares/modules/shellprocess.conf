i18n:
     name: "Enabling Sagittarius Hyper-Performance Engines..."

dontChroot: false
timeout: 60
script:
    - "-systemctl enable greetd.service"
    - "-systemctl enable kexec-cpu-accelerator.service"
    - "-systemctl enable adaptive-memory-engine.service"
    - "-systemctl enable vmtouch-lock.service"
    - "-systemctl enable plocate-updatedb.timer"
